<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Parents School</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">Parents School</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/logout">Déconnexion</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8 mx-auto">
                <h2>Tableau de Bord</h2>
                
                <div class="row mt-4">
                    <div class="col-md-4">
                        <div class="card text-center">
                            <div class="card-body">
                                <h5 class="card-title">Grade Actuel</h5>
                                <h3 class="text-primary" th:text="${user?.currentGrade?.name ?: 'Aucun'}"></h3>
                                <p class="text-muted" th:text="${user?.currentGrade?.benefitAmount ?: '0'} + ' XAF'"></p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <div class="card text-center">
                            <div class="card-body">
                                <h5 class="card-title">Parrainages Directs</h5>
                                <h3 class="text-success" th:text="${user?.directSponsorshipsCount ?: 0}"></h3>
                                <p class="text-muted">Filleuls directs</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <div class="card text-center">
                            <div class="card-body">
                                <h5 class="card-title">Points Totaux</h5>
                                <h3 class="text-warning" th:text="${user?.totalPoints ?: 0}"></h3>
                                <p class="text-muted">Points cumulés</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="mt-4">
                    <h4>Progression vers le prochain grade</h4>
                    <div th:if="${nextGrade}">
                        <p>Prochain grade: <strong th:text="${nextGrade.name}"></strong></p>
                        <p>Parrainages requis: <span th:text="${nextGrade.requiredSponsorships}"></span> 
                           (Actuel: <span th:text="${user?.directSponsorshipsCount ?: 0}"></span>)</p>
                        <p>Points requis: <span th:text="${nextGrade.requiredPoints}"></span> 
                           (Actuel: <span th:text="${user?.totalPoints ?: 0}"></span>)</p>
                    </div>
                    <div th:unless="${nextGrade}">
                        <p class="text-success">Félicitations ! Vous avez atteint le grade maximum.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
