<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Parents School</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">Parents School</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-center">Inscription Membre</h3>
                    </div>
                    <div class="card-body">
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        
                        <form th:action="@{/register}" th:object="${user}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Prénom *</label>
                                <input type="text" class="form-control" th:field="*{firstName}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Nom *</label>
                                <input type="text" class="form-control" th:field="*{lastName}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Email *</label>
                                <input type="email" class="form-control" th:field="*{email}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Téléphone</label>
                                <input type="tel" class="form-control" th:field="*{phone}">
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Mot de passe *</label>
                                <input type="password" class="form-control" th:field="*{password}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Ville</label>
                                <input type="text" class="form-control" th:field="*{city}">
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Parrain *</label>
                                <select class="form-select" name="sponsorId" required>
                                    <option th:if="${defaultSponsor}" 
                                            th:value="${defaultSponsor.id}" 
                                            th:text="${defaultSponsor.firstName + ' ' + defaultSponsor.lastName + ' (Admin)'}" 
                                            selected></option>
                                    <option th:each="user : ${users}" 
                                            th:if="${user.id != defaultSponsor?.id}"
                                            th:value="${user.id}" 
                                            th:text="${user.firstName + ' ' + user.lastName + ' (' + user.sponsorshipCode + ')'}"></option>
                                </select>
                                <small class="form-text text-muted">Sélectionnez votre parrain</small>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Type de Membre</label>
                                <select class="form-select" th:field="*{userType}" onchange="updateMembershipFee()">
                                    <option value="ORDINARY">Membre Ordinaire - 5,000 XAF</option>
                                    <option value="HONOR">Membre d'Honneur - 20,000 XAF</option>
                                    <option value="BENEFACTOR">Bienfaiteur - 5,000 XAF</option>
                                </select>
                                <small class="form-text text-muted" id="feeInfo">Frais d'adhésion : 5,000 XAF</small>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100">S'inscrire</button>
                        </form>
                        
                        <div class="text-center mt-3">
                            <a href="/login">Déjà membre ? Se connecter</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function updateMembershipFee() {
            const select = document.querySelector('select[name="userType"]');
            const feeInfo = document.getElementById('feeInfo');
            const fees = {
                'ORDINARY': '5,000 XAF',
                'HONOR': '20,000 XAF',
                'BENEFACTOR': '5,000 XAF'
            };
            feeInfo.textContent = 'Frais d\'adhésion : ' + fees[select.value];
        }
    </script>
</body>
</html>
